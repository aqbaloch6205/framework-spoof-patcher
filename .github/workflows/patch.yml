name: Patch framework.jar

# Manual trigger.
# Put framework.jar in the repo, default: input/framework.jar,
# commit it, then run this workflow from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Path to the framework.jar in this repo"
        required: true
        default: "input/framework.jar"

      no_trickystore:
        description: "Skip TrickyStore (leaf-hack) - patch PIF + Photos + GameProps only"
        type: boolean
        required: false
        default: false

      generate_mode:
        description: "Add TrickyStore GENERATE / broken-TEE support (wholesale keystore2 replace, same-version only)"
        type: boolean
        required: false
        default: false

      make_release:
        description: "Publish the patched jar as a GitHub Release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java
      # ---------------------------------------------------------
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Verify framework.jar
      # ---------------------------------------------------------
      - name: Verify input exists
        run: |
          set -e

          INPUT="${{ github.event.inputs.input_path }}"

          if [ ! -f "$INPUT" ]; then
            echo "::error::Input not found: $INPUT"
            echo "Commit your framework.jar to the repo and set 'input_path' accordingly."
            exit 1
          fi

          echo "Input framework:"
          ls -lh "$INPUT"

      # ---------------------------------------------------------
      # 4. Download the exact Apktool version used by patch.py
      # ---------------------------------------------------------
      - name: Download Apktool
        run: |
          set -e

          APKTOOL_VERSION="2.9.3"
          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

          echo "Downloading Apktool ${APKTOOL_VERSION}..."

          curl -L --fail --retry 3 \
            -o apktool.jar \
            "$APKTOOL_URL"

          test -s apktool.jar

          echo "Apktool downloaded:"
          ls -lh apktool.jar

      # ---------------------------------------------------------
      # 5. Diagnostic:
      #    Decode and rebuild ORIGINAL framework.jar WITHOUT
      #    applying any patch, using the same API 33 pin as patch.py.
      #
      #    If this fails, the problem is still Apktool/framework
      #    compatibility, not our patch modifications.
      # ---------------------------------------------------------
      - name: Test pristine framework rebuild
        run: |
          set -e

          rm -rf pristine pristine_rebuilt.jar

          echo "========================================"
          echo "PRISTINE FRAMEWORK DECODE"
          echo "========================================"

          java -jar apktool.jar d -f \
            -o pristine \
            "${{ github.event.inputs.input_path }}"

          echo "========================================"
          echo "PIN SDK LEVEL (API 33)"
          echo "========================================"

          python3 -c "import patch; patch.pin_sdk_level('pristine')"
          grep -A2 '^sdkInfo' pristine/apktool.yml

          echo "========================================"
          echo "PRISTINE FRAMEWORK REBUILD"
          echo "========================================"

          java -jar apktool.jar b -f \
            -o pristine_rebuilt.jar \
            pristine

          echo "========================================"
          echo "PRISTINE REBUILD SUCCESS"
          echo "========================================"

          ls -lh pristine_rebuilt.jar

      # ---------------------------------------------------------
      # 6. Run actual framework patcher
      # ---------------------------------------------------------
      - name: Run patcher
        run: |
          set -e

          EXTRA=""

          if [ "${{ github.event.inputs.no_trickystore }}" = "true" ]; then
            EXTRA="$EXTRA --no-trickystore"
          fi

          if [ "${{ github.event.inputs.generate_mode }}" = "true" ]; then
            EXTRA="$EXTRA --generate-mode"
          fi

          echo "========================================"
          echo "PATCH CONFIGURATION"
          echo "========================================"

          echo "Input:"
          echo "${{ github.event.inputs.input_path }}"

          echo "Skip TrickyStore:"
          echo "${{ github.event.inputs.no_trickystore }}"

          echo "GENERATE mode:"
          echo "${{ github.event.inputs.generate_mode }}"

          echo "Publish Release:"
          echo "${{ github.event.inputs.make_release }}"

          echo "========================================"

          python3 patch.py \
            --input "${{ github.event.inputs.input_path }}" \
            --output "output/framework-patched.jar" \
            $EXTRA

      # ---------------------------------------------------------
      # 7. Show output
      # ---------------------------------------------------------
      - name: Show result
        run: |
          set -e

          echo "========================================"
          echo "PATCHED FRAMEWORK OUTPUT"
          echo "========================================"

          if [ ! -f output/framework-patched.jar ]; then
            echo "::error::Patched framework.jar was not created."
            exit 1
          fi

          ls -lh output/framework-patched.jar

      # ---------------------------------------------------------
      # 8. Upload patched framework as GitHub Artifact
      # ---------------------------------------------------------
      - name: Upload patched jar (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: framework-patched
          path: output/framework-patched.jar
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 9. Optional GitHub Release
      # ---------------------------------------------------------
      - name: Publish Release
        if: ${{ github.event.inputs.make_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: patched-${{ github.run_number }}
          name: Patched framework.jar # ${{ github.run_number }}
          files: output/framework-patched.jar
          body: |
            Patched framework.jar produced by framework-spoof-patcher.

            Configuration:

            Input:
            ${{ github.event.inputs.input_path }}

            Skip TrickyStore:
            ${{ github.event.inputs.no_trickystore }}

            GENERATE mode:
            ${{ github.event.inputs.generate_mode }}

            Install as root, then reboot:

              adb push framework-patched.jar /sdcard/
              su -c 'cp /sdcard/framework-patched.jar /system/framework/framework.jar'
              su -c 'chmod 644 /system/framework/framework.jar'

            Configure spoofs via Settings.Secure (see README).
